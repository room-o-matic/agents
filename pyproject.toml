[project]
name = "agentd"
version = "0.1.0"
description = "On-demand agent gateway: ephemeral, sessionful helper workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6",
    "pyjwt[crypto]>=2.9",
    "mcp>=2.3,<3",
]

[project.scripts]
agentd = "agentd.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
