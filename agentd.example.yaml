# agentd config. Point AGENTD_CONFIG (or --config) at a copy of this file.
# AGENTD_<KEY> env vars (e.g. AGENTD_INSTANCE_ID, AGENTD_BASE_URL, AGENTD_LOBBYD_API_KEY)
# override instance_id, data_dir, base_url and the lobbyd_* keys.

instance_id: agentd-host1          # stable and unique; also its lobbyd key name
data_dir: /var/lib/agentd
base_url: http://host1:8765        # advertised in the registry; the audience callers' tokens need

max_sessions: 4                    # concurrent active sessions; more get 429
workspace_roots:                   # workspace paths must resolve under one of these
  - /home/openclaw/.openclaw/workspace
env_allowlist: [PATH, HOME, LANG, LC_ALL, TZ]  # add ANTHROPIC_API_KEY if claude authenticates with one

default_idle_timeout_seconds: 600
ready_timeout_seconds: 60          # worker must emit an AGENT_EVENT within this
stop_grace_seconds: 10             # stop request -> SIGTERM -> SIGKILL spacing
cleanup_interval_seconds: 30

# Who may run work here (docs#9). Default deny: a lobbyd identity alone isn't enough.
# "untrusted" callers only run on backend: sandbox. callers_file is re-read on change,
# so removing an entry there revokes a caller without a restart.
backend: process                   # process = no isolation (trusted callers only) | sandbox
callers:
  missy@local: {trust: trusted, profiles: [workspace_coder, read_only_research], worker_types: ["*"], max_sessions: 2}
# callers_file: /etc/agentd/callers.yaml
# sandbox:                         # bubblewrap; see agentd/backends/sandbox.py
#   ro_paths: [/usr/local/lib/node_modules]   # e.g. an agent CLI install
#   memory_bytes: 4294967296

# Profiles are allowlists. Setting this key replaces the built-in set entirely.
profiles:
  read_only_research: {max_runtime_minutes: 30, workspace_mount: none, filesystem: read}
  workspace_coder: {max_runtime_minutes: 120, workspace_mount: read_write, filesystem: workspace}
  discord_helper: {max_runtime_minutes: 45, filesystem: scratch, discord_send: false, discord_read: true}
  dangerous_needs_approval:        # refused at launch: there is no approval mechanism yet
    max_runtime_minutes: 60
    workspace_mount: read_write
    filesystem: workspace
    external_actions: approval_required

# Worker types: any command that speaks the AGENT_EVENT protocol (see protocol.py).
# Setting this key replaces the built-in set (which only has `fake`).
worker_types:
  fake:
    command: [/opt/agentd/.venv/bin/python, -m, agentd.workers.fake]  # use absolute paths
  # Claude Code (milestone 2). Tool permissions come from the session's profile: no shell
  # unless the profile sets `shell: true`, so workers run `claude --restricted`. Profiles
  # may also set max_budget_usd, claude_tools, claude_permission_mode.
  claude:
    command: [/opt/agentd/.venv/bin/python, -m, agentd.workers.claude_code,
              --claude, /usr/local/bin/claude, --model, sonnet, --max-budget-usd, "2"]
  # Pick the model per worker type. In live room tests haiku was fast and cheap but its
  # reviews were shallow; use sonnet (or better) where judgment matters.
  claude-chat:                     # stays up between turns; stop ends it as completed
    command: [/opt/agentd/.venv/bin/python, -m, agentd.workers.claude_code,
              --claude, /usr/local/bin/claude, --interactive, --model, sonnet,
              --max-budget-usd, "5"]
    # On stop, claude writes the room handoff in one extra turn (--closing-summary-seconds,
    # default 8; keep it below stop_grace_seconds, 0 turns it off).
  # When a session is invited into a room, claude also gets room tools (rooms_read,
  # rooms_send, rooms_note_get, rooms_note_put) and room messages that @-mention the worker
  # wake it. --room-wake all|mentions|none and --room-poll-seconds N tune that; "all" makes
  # every room message cost a turn.

# lobbyd: callers authenticate with lobbyd access tokens for this instance's base_url, and
# the instance heartbeats into lobbyd's registry when lobbyd_api_key is set.
lobbyd_url: http://127.0.0.1:8767
lobbyd_domain: local
# lobbyd_api_key: set AGENTD_LOBBYD_API_KEY instead (an agentd-scope key named instance_id)
registry_ttl_seconds: 60
