name: ci

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repo; never give the token write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: sandbox prerequisites (bubblewrap, unprivileged user namespaces)
        run: |
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: lint
        run: uv run ruff check .
      - name: format
        run: uv run ruff format --check .
      - name: test
        run: uv run pytest -q
